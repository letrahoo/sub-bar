name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Lint, race unit tests & E2E acceptance
        run: make verify

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Lint (including Swift build check)
        run: make lint
      - name: Build server & SubBar.app
        run: |
          make server
          ./macos/Scripts/bundle-app.sh
      - name: Verify app bundle, DMG & bundled server E2E
        run: make verify-app
