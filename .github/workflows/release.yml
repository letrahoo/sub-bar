name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Verify (lint, unit tests, E2E acceptance)
        env:
          SUBBAR_SKIP_SWIFT_LINT: "1"
        run: make verify

      - name: Build universal server
        run: |
          mkdir -p dist
          cd server
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/server-arm64 ./cmd/subbar-server
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/server-amd64 ./cmd/subbar-server
          cd ..
          lipo -create -output dist/subbar-server dist/server-arm64 dist/server-amd64
          rm dist/server-arm64 dist/server-amd64

      - name: Build universal SubBar.app
        env:
          SUBBAR_SWIFT_ARCHS: "--arch arm64 --arch x86_64"
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            export SUBBAR_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./macos/Scripts/bundle-app.sh

      - name: Verify universal app bundle & DMG
        env:
          SUBBAR_EXPECT_UNIVERSAL: "1"
        run: make verify-app

      - name: Checksum
        working-directory: dist
        run: |
          for file in SubBar-macOS.zip SubBar-macOS.dmg; do
            shasum -a 256 "$file" > "$file.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SubBar-macOS
          if-no-files-found: error
          path: |
            dist/SubBar-macOS.zip
            dist/SubBar-macOS.zip.sha256
            dist/SubBar-macOS.dmg
            dist/SubBar-macOS.dmg.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SubBar-macOS.zip
            dist/SubBar-macOS.zip.sha256
            dist/SubBar-macOS.dmg
            dist/SubBar-macOS.dmg.sha256
